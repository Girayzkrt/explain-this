name: Bug report
description: Something in the extension behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste the text you were reading, or the model's answer.** Explain This is
        built so that page content never leaves your machine, and an issue is a public
        place. Describe the passage instead, or reproduce it with text you invented.

        Settings has a **Copy diagnostics** button. That report is built from an allowlist
        of local setup facts and cannot contain page text or model output, so it is safe to
        paste here.
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: From chrome://version
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: ollama-version
    attributes:
      label: Ollama version
      description: Output of `ollama --version`
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Selected model
      placeholder: "qwen2.5:3b-instruct"
    validations:
      required: true
  - type: input
    id: error-code
    attributes:
      label: Error code
      description: The code from docs/troubleshooting.md, if one was shown
      placeholder: "FIRST_TOKEN_TIMEOUT"
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use invented or public-domain text, never a page you were actually reading.
      placeholder: |
        1. Select the sentence "..." on a local test page
        2. Press Alt+Shift+E
        3. Choose Explain
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste the output of the Copy diagnostics button in Settings.
      render: json
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no page text I was reading and no model output.
          required: true

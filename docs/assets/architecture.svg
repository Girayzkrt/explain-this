<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Explain This component architecture</title>
  <desc id="desc">The page-side reader surface talks to a background service worker over a named port. Only the background worker performs model HTTP, and only to Ollama on 127.0.0.1 port 11434.</desc>
  <rect width="880" height="470" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">Explain This — component architecture</text>
    <text x="24" y="55" font-size="12.5" fill="#656d76">All model access is confined to the background service worker. Nothing leaves the device.</text>

    <!-- Web page -->
    <rect x="24" y="80" width="250" height="150" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="40" y="104" font-size="13" font-weight="600" fill="#1f2328">Web page</text>
    <rect x="40" y="118" width="218" height="94" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="54" y="139" font-size="12.5" font-weight="600" fill="#1f2328">Reader surface</text>
    <text x="54" y="158" font-size="11.5" fill="#656d76">Shadow DOM, isolated from</text>
    <text x="54" y="173" font-size="11.5" fill="#656d76">hostile page CSS</text>
    <text x="54" y="194" font-size="11.5" fill="#656d76">Selection · toolbar · card</text>

    <!-- Extension pages -->
    <rect x="24" y="256" width="250" height="120" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="40" y="280" font-size="13" font-weight="600" fill="#1f2328">Extension pages</text>
    <text x="40" y="302" font-size="11.5" fill="#656d76">Options — onboarding, settings,</text>
    <text x="40" y="317" font-size="11.5" fill="#656d76">diagnostics</text>
    <text x="40" y="339" font-size="11.5" fill="#656d76">Side panel — current request</text>
    <text x="40" y="354" font-size="11.5" fill="#656d76">and follow-ups</text>

    <!-- Trust boundary -->
    <rect x="332" y="74" width="292" height="310" rx="10" fill="none" stroke="#8250df" stroke-dasharray="6 4"/>
    <text x="338" y="66" font-size="11.5" font-weight="600" fill="#8250df">Trust boundary</text>

    <!-- Background worker -->
    <rect x="348" y="90" width="260" height="278" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="364" y="114" font-size="13" font-weight="600" fill="#1f2328">Background service worker</text>
    <rect x="364" y="128" width="228" height="42" rx="6" fill="#ffffff" stroke="#54aeff"/>
    <text x="378" y="146" font-size="12" font-weight="600" fill="#1f2328">Request coordinator</text>
    <text x="378" y="162" font-size="11" fill="#656d76">one generation at a time</text>
    <rect x="364" y="180" width="228" height="42" rx="6" fill="#ffffff" stroke="#54aeff"/>
    <text x="378" y="198" font-size="12" font-weight="600" fill="#1f2328">Budgets + validation</text>
    <text x="378" y="214" font-size="11" fill="#656d76">1600 / 400 / 600 tokens</text>
    <rect x="364" y="232" width="228" height="42" rx="6" fill="#ffffff" stroke="#54aeff"/>
    <text x="378" y="250" font-size="12" font-weight="600" fill="#1f2328">Prompt builder</text>
    <text x="378" y="266" font-size="11" fill="#656d76">system policy + user message</text>
    <rect x="364" y="284" width="228" height="42" rx="6" fill="#ffffff" stroke="#54aeff"/>
    <text x="378" y="302" font-size="12" font-weight="600" fill="#1f2328">Ollama provider</text>
    <text x="378" y="318" font-size="11" fill="#656d76">the only code doing model HTTP</text>
    <text x="364" y="350" font-size="11.5" fill="#656d76">storage.local — preferences</text>
    <text x="364" y="364" font-size="11.5" fill="#0969da">storage.session — per-tab, cleared</text>

    <!-- Ollama -->
    <rect x="666" y="150" width="190" height="120" rx="8" fill="#dafbe1" stroke="#2da44e"/>
    <text x="682" y="176" font-size="13" font-weight="600" fill="#1f2328">Ollama</text>
    <text x="682" y="198" font-size="12" fill="#1a7f37">127.0.0.1:11434</text>
    <text x="682" y="219" font-size="11.5" fill="#656d76">On your machine.</text>
    <text x="682" y="234" font-size="11.5" fill="#656d76">The only network</text>
    <text x="682" y="249" font-size="11.5" fill="#656d76">destination.</text>

    <!-- Arrows -->
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#656d76"/>
      </marker>
    </defs>
    <line x1="274" y1="160" x2="344" y2="160" stroke="#656d76" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="256" y="150" font-size="10.5" fill="#656d76">named port</text>
    <line x1="274" y1="300" x2="344" y2="260" stroke="#656d76" stroke-width="1.4" marker-end="url(#arrow)"/>
    <line x1="612" y1="210" x2="662" y2="210" stroke="#2da44e" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="600" y="200" font-size="10.5" fill="#1a7f37">loopback HTTP</text>

    <text x="24" y="410" font-size="11.5" fill="#656d76">The reader surface never receives an endpoint, a prompt, or a provider handle — only typed messages.</text>
    <text x="24" y="429" font-size="11.5" fill="#656d76">The side panel can read the safe session snapshot, never the private source envelope.</text>
    <text x="24" y="448" font-size="11.5" fill="#656d76">No telemetry, no analytics, no remote endpoint of any kind.</text>
  </g>
</svg>

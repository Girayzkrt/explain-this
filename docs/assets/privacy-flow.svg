<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="ptitle pdesc">
  <title id="ptitle">Explain This data flow, by mode</title>
  <desc id="pdesc">Selected text and optional nearby context go to a local Ollama server on loopback — the only host the extension itself ever talks to. Hidden text, form values, scripts, navigation and distant page content are excluded. In the default On this computer mode, nothing reaches the internet. In Ollama Cloud mode, chosen at setup, Ollama itself forwards your selection on to its own cloud servers.</desc>
  <rect width="880" height="400" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328">Where your reading actually goes</text>
    <text x="24" y="55" font-size="12.5" fill="#656d76">By default, everything below happens on your computer — Ollama Cloud is opt-in.</text>

    <!-- Page -->
    <rect x="24" y="80" width="236" height="234" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="40" y="104" font-size="13" font-weight="600" fill="#1f2328">The page you are reading</text>

    <rect x="40" y="118" width="204" height="56" rx="6" fill="#dafbe1" stroke="#2da44e"/>
    <text x="54" y="139" font-size="12" font-weight="600" fill="#1a7f37">Text you selected</text>
    <text x="54" y="158" font-size="11" fill="#1a7f37">always sent</text>

    <rect x="40" y="182" width="204" height="56" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="54" y="203" font-size="12" font-weight="600" fill="#7d4e00">Nearby visible blocks</text>
    <text x="54" y="222" font-size="11" fill="#7d4e00">opt-in, off by default</text>

    <rect x="40" y="246" width="204" height="54" rx="6" fill="#ffebe9" stroke="#cf222e"/>
    <text x="54" y="266" font-size="12" font-weight="600" fill="#a40e26">Never sent</text>
    <text x="54" y="284" font-size="10.5" fill="#a40e26">hidden text · forms · scripts · nav</text>

    <!-- Extension -->
    <rect x="330" y="120" width="216" height="150" rx="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="346" y="144" font-size="13" font-weight="600" fill="#1f2328">Explain This</text>
    <text x="346" y="166" font-size="11.5" fill="#656d76">Bounds the request</text>
    <text x="346" y="184" font-size="11.5" fill="#656d76">Builds the prompt</text>
    <text x="346" y="202" font-size="11.5" fill="#656d76">Streams the answer back</text>
    <text x="346" y="228" font-size="11.5" fill="#0969da">Kept only for this request,</text>
    <text x="346" y="244" font-size="11.5" fill="#0969da">in session storage</text>
    <text x="346" y="260" font-size="11.5" fill="#0969da">Preferences only on disk</text>

    <!-- Ollama -->
    <rect x="616" y="120" width="240" height="150" rx="8" fill="#dafbe1" stroke="#2da44e"/>
    <text x="632" y="144" font-size="13" font-weight="600" fill="#1f2328">Ollama, on your machine</text>
    <text x="632" y="168" font-size="12.5" fill="#1a7f37">127.0.0.1:11434</text>
    <text x="632" y="192" font-size="11.5" fill="#656d76">Generates the explanation</text>
    <text x="632" y="210" font-size="11.5" fill="#656d76">using the model you chose</text>
    <text x="632" y="228" font-size="11.5" fill="#656d76">at setup — local or cloud</text>

    <defs>
      <marker id="parrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#2da44e"/>
      </marker>
      <marker id="pblock" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#cf222e"/>
      </marker>
    </defs>
    <line x1="248" y1="150" x2="326" y2="165" stroke="#2da44e" stroke-width="1.6" marker-end="url(#parrow)"/>
    <line x1="248" y1="208" x2="326" y2="195" stroke="#d4a72c" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#parrow)"/>
    <line x1="550" y1="195" x2="612" y2="195" stroke="#2da44e" stroke-width="1.8" marker-end="url(#parrow)"/>
    <text x="548" y="185" font-size="10.5" fill="#1a7f37">loopback only</text>

    <!-- Internet, blocked -->
    <rect x="616" y="296" width="240" height="64" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-dasharray="6 4"/>
    <text x="632" y="322" font-size="13" font-weight="600" fill="#a40e26">The internet</text>
    <text x="632" y="343" font-size="11.5" fill="#a40e26">Not directly — only via Ollama.</text>
    <line x1="736" y1="274" x2="736" y2="292" stroke="#cf222e" stroke-width="1.6" marker-end="url(#pblock)"/>
    <line x1="726" y1="278" x2="746" y2="288" stroke="#cf222e" stroke-width="2.4"/>
    <line x1="746" y1="278" x2="726" y2="288" stroke="#cf222e" stroke-width="2.4"/>

    <text x="24" y="344" font-size="11.5" fill="#656d76">No telemetry. No analytics. No account. No remote logging.</text>
    <text x="24" y="366" font-size="11.5" fill="#656d76">Session data is deleted when the tab navigates or closes.</text>
  </g>
</svg>
